# Packaging configuration (docs/ARCHITECTURE.md §11).
#
# electron-builder discovers this file at the project root; `build/` holds the
# signing resources it references. `dependencies` (better-sqlite3,
# electron-updater) are bundled automatically; everything else is dev-only.
appId: com.yichen.todolist
productName: YiChen ToDo
copyright: Copyright (c) 2026 YiChen

directories:
  output: release
  buildResources: build

files:
  - out/**
  - resources/**
  - package.json

extraResources:
  - from: resources
    to: resources

# Provider metadata is what makes electron-builder emit `latest.yml` /
# `latest-mac.yml` next to the installers; those are the files electron-updater
# reads. Publishing itself happens in `.github/workflows/release.yml`, which
# uploads everything to one GitHub Release, so both platforms land together.
publish:
  provider: github
  owner: 2268027569
  repo: DoList

# better-sqlite3 loads a native binary that cannot run from inside the asar.
npmRebuild: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  # A real multi-size .ico rather than the 512px PNG: builder's PNG→ICO step runs a
  # WASM icon tool that needs a few hundred MB and fails on low-memory machines
  # (`WebAssembly.Memory(): could not allocate memory`). `scripts/make-icons.mjs`
  # regenerates this file from `icon.png`.
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: YiChen ToDo
  # Every artifact is named explicitly and without spaces: the name goes into
  # `latest.yml`, and the updater fetches exactly that URL from the release. The
  # default name contains spaces, which the GitHub publisher rewrites to dashes —
  # leaving the metadata pointing at a file that does not exist under that name.
  artifactName: YiChen-ToDo-Setup-${version}-${arch}.${ext}

portable:
  artifactName: YiChen-ToDo-Portable-${version}-${arch}.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # dmg and zip differ only in extension, so one explicit pattern covers both and
  # keeps `latest-mac.yml` pointing at the zip it will actually download.
  artifactName: YiChen-ToDo-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
