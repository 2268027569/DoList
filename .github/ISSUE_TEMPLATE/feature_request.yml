name: 功能建议 / Feature request
description: 提议新功能或改进现有功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提议前请先读 [docs/FEATURES.md](https://github.com/2268027569/DoList/blob/main/docs/FEATURES.md)：
        功能范围、优先级（P0/P1/P2）与"明确不做"的事项都写在那里。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实场景 / The real problem
      description: 描述你现在的痛点，以及这个问题多久出现一次、影响多大。先说问题，再说方案。
      placeholder: 例如：我每天要记十几条临时任务，打开面板再输入太慢，希望复制文本后一键变成任务。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案 / Proposed solution
      description: 你期望的交互与行为。越具体越好，可以写"我想按 X 键然后……"。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案 / Alternatives considered
      description: 其他工具怎么解决？为什么那些方案不适合你？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 与现有范围的关系 / Relation to current scope
      multiple: false
      options:
        - 属于现有模块，只是提升优先级（对应 FEATURES.md 中已有的 P1/P2 条目）
        - 属于现有模块，但 FEATURES.md 中没有提到
        - 属于"明确不做"的范围（团队协作、云端账号、看板/甘特、移动端等）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 影响范围 / Who benefits
      multiple: false
      options:
        - 绝大多数用户都会用到
        - 一部分特定场景用户会用到
        - 只有我这类少数场景需要
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索现有 Issue，确认没有人提过相同建议。
          required: true
        - label: 我理解这个项目保持轻量，"功能更多"本身不是目标。
          required: true
